[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.0.1"
description = "Describe Your Cool Project"
authors = [{ name = "" }]
requires-python = ">=3.12"
dependencies = ["lightning", "hydra-core"]

[project.urls]
Homepage = "https://github.com/user/project"

# use this to customize global commands available in the terminal after installing the package
[project.scripts]
train_command = "src.train:main"
eval_command = "src.eval:main"
tune_command = "src.tune:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["logs", "data"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "S",   # bandit (security)
  "D",   # pydocstyle
]
ignore = [
  "E501",  # line too long (handled by the formatter where possible)
  "E402",  # imports after `rootutils.setup_root(...)`
  "S101",  # asserts
  "B905",  # `zip()` without `strict=`
  "D100", "D104", "D105", "D107",  # missing docstrings in modules, packages, magic methods, __init__
  "D205", "D212", "D415", "D200", "D401",  # docstring formatting
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"tests/**" = ["D", "S"]
"notebooks/**" = ["D"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
