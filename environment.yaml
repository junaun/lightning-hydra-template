# conda provides the python interpreter, all python packages are installed
# with pip from `requirements.txt`
#
# the `pytorch` conda channel is discontinued, so pytorch is installed from PyPI
# (default PyPI wheels on linux ship with CUDA, to pick a specific CUDA build
# uncomment the `--extra-index-url` line below)

name: lht

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip>=24

  - pip:
      # - --extra-index-url https://download.pytorch.org/whl/cu130
      - -r requirements.txt
